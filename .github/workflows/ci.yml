name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  code-quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff black

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Syntax check
        run: python -m compileall -q .